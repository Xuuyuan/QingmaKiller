name: Release

on:
  workflow_dispatch:  # 手动触发仅执行构建并上传 artifact, 用于发版前验证
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史, 供打包脚本比对上一 tag 生成变更日志

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          pip install .
          pip install pyinstaller

      - name: 构建发行包
        run: python scripts/package_release.py

      - name: 上传构建产物(仅手动触发时)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/QingmaKiller_*.zip \
            --title "QingmaKiller $GITHUB_REF_NAME" \
            --notes-file dist/release_notes.md
